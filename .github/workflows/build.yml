name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies & Build Web
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Setup Signing Keystore
        run: |
          if [ -f android/app/debug.keystore.base64 ] && [ ! -f android/app/debug.keystore ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d android/app/debug.keystore.base64 > android/app/debug.keystore
          fi
          if [ ! -f android/app/debug.keystore ]; then
            echo "Generating debug.keystore with keytool..."
            keytool -genkeypair -v -keystore android/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p ~/.android && cp android/app/debug.keystore ~/.android/debug.keystore

      - name: Show Signing Report (SHA-1)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
