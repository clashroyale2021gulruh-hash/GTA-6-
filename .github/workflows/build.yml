name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Build web application
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Setup Release Keystore
        run: |
          if [ -f android/app/release.keystore.base64 ] && [ ! -f android/app/release.keystore ]; then
            echo "Restoring release.keystore from base64..."
            base64 -d android/app/release.keystore.base64 > android/app/release.keystore
          fi

          if [ ! -f android/app/release.keystore ]; then
            echo "Generating release.keystore with keytool..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias gta6release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gta6releasepass \
              -keypass gta6releasepass \
              -dname "CN=GTA6Companion, OU=App, O=GTA, L=ViceCity, S=FL, C=US"
          fi

          ls -la android/app/release.keystore

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify, Align and Sign Release APK with apksigner
        run: |
          OUTPUT_DIR="android/app/build/outputs/apk/release"
          echo "Listing release outputs directory:"
          ls -la "$OUTPUT_DIR"

          APK_FILE=$(find "$OUTPUT_DIR" -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK file found in $OUTPUT_DIR"
            exit 1
          fi
          echo "Found APK: $APK_FILE"

          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools/ -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_SDK_ROOT/build-tools/ -name zipalign | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          echo "Using zipalign: $ZIPALIGN"

          TARGET_APK="$OUTPUT_DIR/app-release.apk"
          if [ "$APK_FILE" != "$TARGET_APK" ]; then
            cp "$APK_FILE" "$TARGET_APK"
          fi

          # Check if APK is already validly signed with v1/v2
          if ! "$APKSIGNER" verify --verbose "$TARGET_APK"; then
            echo "APK is not validly signed. Signing with release.keystore..."
            
            # Align if not aligned
            "$ZIPALIGN" -c -v 4 "$TARGET_APK" || {
              echo "Aligning APK..."
              "$ZIPALIGN" -f -p 4 "$TARGET_APK" "/tmp/aligned.apk"
              mv "/tmp/aligned.apk" "$TARGET_APK"
            }

            "$APKSIGNER" sign \
              --ks android/app/release.keystore \
              --ks-pass pass:gta6releasepass \
              --ks-key-alias gta6release \
              --key-pass pass:gta6releasepass \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "$TARGET_APK"
          else
            echo "APK is already verified and signed by Gradle!"
          fi

          echo "Final apksigner verification:"
          "$APKSIGNER" verify --verbose "$TARGET_APK"
          ls -lh "$TARGET_APK"

      - name: Upload Release APK (app-release.apk)
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
