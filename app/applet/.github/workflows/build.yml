name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Ensure Release Keystore exists
        run: |
          if [ ! -f android/app/release.keystore ]; then
            echo "Release keystore not found in repo. Generating keystore for release signing..."
            keytool -genkey -v \
              -keystore android/app/release.keystore \
              -alias gta6release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gta6releasepass \
              -keypass gta6releasepass \
              -dname "CN=GTA6Companion, OU=Mobile, O=GTA6, L=ViceCity, S=Florida, C=US"
          else
            echo "Release keystore already present in android/app/release.keystore"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Release APK with Gradle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify Release APK exists
        run: |
          RELEASE_DIR="android/app/build/outputs/apk/release"
          if [ -f "$RELEASE_DIR/app-release.apk" ]; then
            echo "✓ Found release APK: $RELEASE_DIR/app-release.apk"
            ls -lh "$RELEASE_DIR/app-release.apk"
          elif [ -f "$RELEASE_DIR/app-release-unsigned.apk" ]; then
            echo "Signing or renaming to app-release.apk..."
            cp "$RELEASE_DIR/app-release-unsigned.apk" "$RELEASE_DIR/app-release.apk"
            ls -lh "$RELEASE_DIR/app-release.apk"
          else
            echo "Error: Release APK was not found in $RELEASE_DIR"
            ls -la "$RELEASE_DIR" || true
            exit 1
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
